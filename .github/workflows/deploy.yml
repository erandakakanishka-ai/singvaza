name: 🚀 Deploy to Cloudflare Pages

# Every push to main goes live on https://singvaza.pages.dev.
# The workflow never deletes or recreates the Pages project: it creates it only
# if it is missing (same name => same address), re-applies the D1 binding and
# uploads the files. The Cloudflare token is a repository secret created with
# "no expiration", so this cannot rot like the old one.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Keep the Pages project. Its D1 binding and the Turnstile keys are preserved
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Only re-applied when the secret exists; otherwise whatever the project
          # already has stays exactly as it is.
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: python3 scripts/ensure_pages_project.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.86.0 pages deploy public --project-name=singvaza --branch=main --commit-dirty=true
