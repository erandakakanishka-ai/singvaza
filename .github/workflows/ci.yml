name: ✅ Tests (push checks)

# Cloudflare Pages deploys singvaza.pages.dev straight from this repository
# through its Git integration, so there is no deploy step (and no Cloudflare
# API token) in GitHub Actions any more. This workflow only proves that a push
# is safe to go live.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit, security and model tests
        run: npm test
